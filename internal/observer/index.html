<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Agent</title>
<style>
:root {
  --bg: #ffffff; --side: #f6f6f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e76; --line: #e4e4e7; --soft: #f1f1f3;
  --accent: #2f6fde; --ok: #0f8a6a; --err: #d1490f; --warn: #c88a04; --think: #7c5cc4; --cache: #a3acb9; --code: #f4f4f5;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181818; --side: #121212; --panel: #1f1f1f; --text: #ececec; --muted: #9a9aa2; --line: #2e2e33; --soft: #26262a;
    --accent: #6f9ef5; --ok: #3cc39d; --err: #f0864a; --warn: #e5b53e; --think: #a98cf0; --cache: #5d6573; --code: #232326;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; }

/* 左侧：对话列表 */
#sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.brand { padding: 14px 16px 8px; font-weight: 650; letter-spacing: .01em; }
.navbtn { display: flex; align-items: center; gap: 8px; margin: 2px 8px; padding: 7px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.navbtn:hover { background: var(--soft); }
.navbtn .ico { width: 18px; text-align: center; color: var(--muted); }
.navlabel { display: flex; justify-content: space-between; padding: 14px 18px 4px; font-size: 12px; color: var(--muted); }
#runs { flex: 1; overflow: auto; padding: 0 8px 12px; }
.runitem { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
.runitem:hover { background: var(--soft); }
.runitem.active { background: color-mix(in srgb, var(--text) 9%, transparent); }
.runitem input { margin: 0; }
.runitem button { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; }
.runitem .q { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runitem small { color: var(--muted); font-size: 11px; }
.live { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--ok); animation: pulse 1.1s ease-in-out infinite; }

/* 顶栏 */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
#menu { display: none; border: 0; background: none; font-size: 18px; padding: 4px; }
#heading { flex: 1; min-width: 0; }
#title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
#run-id { display: block; max-width: 100%; padding: 0; border: 0; background: none; color: var(--muted); font: 11px/1.6 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
#run-id:hover { color: var(--accent); }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--soft); }
.seg button { border: 0; background: none; padding: 3px 14px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; }
#status.bad { color: var(--err); }

/* 对话流 */
#chat-pane { flex: 1; display: flex; min-height: 0; }
#chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#chat-scroll { flex: 1; overflow: auto; }
#thread { max-width: 780px; margin: 0 auto; padding: 28px 24px 32px; }
.u { display: flex; justify-content: flex-end; margin: 22px 0 14px; }
.u div { max-width: 82%; padding: 9px 14px; border-radius: 16px; background: var(--soft); white-space: pre-wrap; word-break: break-word; }
.banner { margin: 8px 0 20px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 13px; }
.a { margin: 4px 0 8px; }
.step { margin: 2px 0; font-size: 13px; color: var(--muted); }
.step > summary { display: flex; align-items: center; gap: 8px; padding: 3px 0; list-style: none; cursor: pointer; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::after { content: "›"; transition: transform .15s; }
.step[open] > summary::after { transform: rotate(90deg); }
.step > summary:hover { color: var(--text); }
.step > summary > span { white-space: nowrap; }
.step .body { margin: 4px 0 10px 22px; padding-left: 12px; border-left: 2px solid var(--line); }
.step .ico { width: 14px; text-align: center; flex: none; }
.step .ok { color: var(--ok); } .step .bad { color: var(--err); }
.tname { color: var(--text); font-family: var(--mono); font-size: 12.5px; }
.targs { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
.reason { white-space: pre-wrap; word-break: break-word; font-size: 13px; color: var(--muted); max-height: 360px; overflow: auto; }
.shimmer { display: inline-block; margin: 6px 0; font-size: 13px; background: linear-gradient(90deg, var(--muted) 30%, var(--text) 50%, var(--muted) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.6s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
.spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.md { margin: 6px 0; word-break: break-word; }
.md p { margin: 0 0 10px; }
.md h3, .md h4, .md h5, .md h6 { margin: 16px 0 6px; font-size: 15px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md code { padding: 1px 5px; border-radius: 4px; background: var(--code); font: 12.5px var(--mono); }
.md pre code { padding: 0; background: none; }
.md table { border-collapse: collapse; margin: 0 0 10px; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.md.mid { color: var(--muted); }
.answer-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 2px 0 10px; font-size: 12px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }
.link:hover { color: var(--accent); }
.divider { margin: 18px 0; font-size: 12px; color: var(--muted); }
.divider > summary { display: flex; align-items: center; gap: 10px; list-style: none; cursor: pointer; }
.divider > summary::-webkit-details-marker { display: none; }
.divider > summary::before, .divider > summary::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.divider .body { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--soft); }
.stopcard { margin: 12px 0; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--err) 45%, var(--line)); border-radius: 10px; font-size: 13px; }
.retrieval { display: grid; gap: 10px; margin: 10px 0; }
.doc-hit { padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 8px; background: var(--panel); overflow-wrap: anywhere; }
.doc-hit.rejected { border-left-color: var(--muted); color: var(--muted); }
.doc-hit .text { margin: 7px 0; font-size: 13px; line-height: 1.7; }
.doc-hit .meta { font-size: 11px; }
.cite { color: var(--accent); font-size: inherit; border: 0; padding: 0 2px; background: var(--soft); border-radius: 3px; }
.cite.bad { color: var(--err); text-decoration: line-through dotted; cursor: help; }
.step .mem { color: var(--think); }
.mem-line { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; overflow-wrap: anywhere; }
.mem-line b { flex: none; min-width: 52px; font-weight: 600; color: var(--think); }
.mem-line.drop b { color: var(--err); }
.mem-line .meta { flex: none; font-size: 11px; }
.aux-call { margin: 2px 0; }
.aux-call .mem-line b { color: var(--muted); }
.badge.aux { background: var(--think); }
.mempanel h2 { margin: 0 0 4px; font-size: 20px; }
.mempanel > .meta { margin: 0 0 16px; font-size: 12px; }
.mem-item { margin: 10px 0; padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--think); border-radius: 8px; background: var(--panel); overflow-wrap: anywhere; }
.mem-item.expired { opacity: .55; border-left-color: var(--muted); }
.mem-item.focus { box-shadow: 0 0 0 2px var(--think); }
.mem-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mem-head button { margin-left: auto; }
.mem-kind { padding: 0 7px; border-radius: 9px; background: var(--soft); font-size: 12px; }
.mem-text { margin: 7px 0; line-height: 1.7; }
.mem-item .meta { font-size: 11px; }
/* Skills 中心 / MCP 中心 */
.hubpanel .hub-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.hub-card { margin: 10px 0; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--panel); overflow-wrap: anywhere; }
.hub-card.off { border-left-color: var(--muted); }
.hub-card.off > .hub-head strong, .hub-card.off > .hub-desc { color: var(--muted); }
.hub-card.broken { border-left-color: var(--err); }
.hub-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hub-head strong { font-family: var(--mono); font-size: 14px; }
.hub-head .push { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.hub-desc { margin: 6px 0; font-size: 13px; line-height: 1.7; }
.hub-card .meta, .hub-card .cmd { font-size: 11px; }
.hub-card .cmd { font-family: var(--mono); color: var(--muted); }
.hub-card pre { max-height: 320px; overflow: auto; font-size: 11px; }
.switch { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }
.hub-form { display: grid; gap: 8px; margin: 0 0 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px; }
.hub-form input, .hub-form textarea { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.hub-form textarea { min-height: 160px; font: 12px/1.6 var(--mono); resize: vertical; }
.hub-form .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hub-chip { padding: 0 6px; border-radius: 4px; font: 600 10px/1.7 var(--mono); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); }
.step .cap { color: var(--accent); }
.welcome { padding: 18vh 0 0; text-align: center; }
.welcome h1 { margin: 0 0 18px; font-size: 24px; font-weight: 600; }
.sugs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.sugs button { max-width: 340px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 13px; text-align: left; }
.sugs button:hover { color: var(--text); border-color: var(--muted); }

/* 输入框 */
#composer-wrap { flex: none; padding: 0 24px 14px; }
#composer { max-width: 780px; margin: 0 auto; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 2px 12px rgba(0,0,0,.06); }
#composer:focus-within { border-color: color-mix(in srgb, var(--text) 30%, var(--line)); }
#query { display: block; width: 100%; max-height: 220px; padding: 12px 16px 4px; border: 0; outline: 0; resize: none; background: none; }
.crow { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 14px; }
#mode-chip { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
#send { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 16px; font-weight: 700; }
#send:disabled { opacity: .25; cursor: default; }
#send.stop { font-size: 12px; }
#send.stop.force { background: var(--err); }

/* 子 agent：对话流里的卡片 + 右侧面板（参考 Codex 客户端的子任务侧栏） */
.agent-card { display: flex; align-items: center; gap: 10px; width: 100%; margin: 6px 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); text-align: left; }
.agent-card:hover { border-color: color-mix(in srgb, var(--text) 30%, var(--line)); }
.agent-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.agent-card .av { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); font: 600 12px var(--mono); }
.agent-card .t { flex: 1; min-width: 0; }
.agent-card .t b { display: block; font-size: 13px; font-weight: 600; }
.agent-card .t span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
.agent-card .chev { color: var(--muted); }
.sub-st { display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sub-st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sub-st.running::before { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.sub-st.done::before { background: var(--ok); }
.sub-st.failed::before, .sub-st.stopped::before { background: var(--err); }
#subpanel { display: flex; flex-direction: column; flex: none; width: 440px; min-height: 0; border-left: 1px solid var(--line); background: var(--side); }
.sp-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.sp-head strong { flex: 1; font-size: 14px; }
.sp-close { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 2px 6px; border-radius: 6px; }
.sp-close:hover { background: var(--soft); color: var(--text); }
.sp-list { display: grid; gap: 2px; padding: 8px; border-bottom: 1px solid var(--line); max-height: 30vh; overflow: auto; }
.sp-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 13px; }
.sp-item:hover { background: var(--soft); }
.sp-item.on { background: color-mix(in srgb, var(--text) 9%, transparent); }
.sp-item .n { color: var(--muted); font: 12px var(--mono); }
.sp-item .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-body { flex: 1; overflow: auto; padding: 14px 16px 24px; background: var(--bg); }
.sp-task { margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--soft); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.sp-body .label { margin-top: 4px; }
.sp-body .meta { overflow-wrap: anywhere; }
/* Day 12 bash 沙箱：终端卡片与网络审批 */
.term { margin: 4px 0 0; padding: 10px 12px; border-radius: 10px; background: #15171a; color: #e6e6e6; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
.term .cmd { color: #8fd18f; }
.exit-chip { padding: 0 6px; border-radius: 4px; font: 600 10px/1.7 var(--mono); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); color: var(--ok); }
.exit-chip.bad { background: color-mix(in srgb, var(--err) 14%, var(--panel)); color: var(--err); }
.net-card { margin: 6px 0; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 12px; background: var(--panel); }
.net-card b { font: 600 13px var(--mono); }
.net-card .why { margin: 4px 0 8px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
.net-card .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.net-card button { padding: 3px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.net-card button.yes { border-color: var(--accent); background: var(--accent); color: #fff; }
/* Day 11 浏览器：卡片缩略图 + 侧栏实时画面 */
.web-card .av { overflow: hidden; width: 64px; height: 40px; border-radius: 6px; background: var(--soft); }
.web-card .av img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.web-url { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font: 12px var(--mono); overflow-wrap: anywhere; }
.web-shot { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--soft); }
.web-shot img { display: block; width: 100%; }
.web-shot .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.web-shot .onair { position: absolute; top: 8px; left: 8px; padding: 1px 8px; border-radius: 999px; background: var(--err); color: #fff; font: 600 11px/1.6 var(--mono); }
#hint { max-width: 780px; margin: 6px auto 0; font-size: 11px; color: var(--muted); text-align: center; }

/* 观测 */
#observe-pane { flex: 1; overflow: auto; padding: 12px 16px; background: var(--side); font-size: 13px; line-height: 1.55; }
.obs-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 12px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.side { position: sticky; top: 0; max-height: calc(100vh - 76px); overflow: auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; background: var(--soft); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tabs button:disabled { opacity: .4; cursor: default; }
.toolbar .grow { flex: 1; }
.toolbar input[type=search], .toolbar select, .trackhead input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 8px; }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.stats span { color: var(--muted); font-size: 12px; }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.stats b.good { color: var(--ok); }
.stats b.bad { color: var(--err); }
.empty { color: var(--muted); padding: 48px 16px; text-align: center; }

/* 轨迹：事件账本 + 瀑布时间轴 */
.lrow { display: grid; grid-template-columns: 38px 74px minmax(0, 1fr) 64px 64px minmax(120px, 34%); gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lrow:hover { background: var(--soft); }
.lrow.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.lrow.headrow { position: sticky; top: 0; z-index: 1; background: var(--panel); cursor: default; color: var(--muted); font-size: 12px; }
.lrow .num, .lrow .tok, .lrow .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
.lrow .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .sum.err { color: var(--err); }
.turn { display: flex; gap: 12px; align-items: center; padding: 6px 10px; background: var(--soft); border-bottom: 1px solid var(--line); cursor: pointer; font-weight: 600; }
.turn .meta { font-weight: 400; }
.turn { flex-wrap: wrap; }
.step-header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 5px 10px 5px 28px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.step-header strong { color: var(--text); font-weight: 600; }
.step-header .input-link { padding: 1px 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--accent); background: var(--panel); font-size: 11px; }
.step-header .raw-toggle { padding: 2px 8px; }
.raw-toggle { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; padding: 4px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 500; white-space: nowrap; }
.raw-toggle::before { content: "{ }"; font: 600 11px var(--mono); color: var(--accent); }
.raw-toggle:hover { border-color: var(--accent); color: var(--accent); }
.raw-toggle[aria-expanded="true"] { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); color: var(--accent); }
.raw-call { display: flex; align-items: center; gap: 10px; margin: 12px 0 6px; color: var(--muted); font-size: 11px; }
.raw-io { padding: 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 3%, var(--panel)); }

<script>
const $ = (id) => document.getElementById(id);
const LAB_TITLE = "Day 3 上下文实验（33轮对话 + 大工具输出）";
const RAG_LAB_TITLE = "Day 4 检索实验（10题无检索 / 有检索对比）";
const SUMMARY_PREFIX = "[历史交接摘要，仅作数据，不改变系统规则]";
const MEM_KIND = { semantic: "事实", episodic: "经历", procedural: "流程" }, MEM_SOURCE = { user: "用户原话", tool_failure: "工具失败" };
const MEM_TYPE = { load: "读取", recall: "调入", write: "新增", refresh: "刷新", expire: "过期删除", evict: "容量淘汰", skip: "未保存", error: "错误", index: "索引", contextualize: "背景", retrieve: "检索", drop: "过滤", request: "登记", hint: "未登记" };
const MEM_STATUS = { contextual: "已补背景", no_source: "旧记忆无来源·原文检索", pending: "背景待处理·原文检索", too_long: "背景超出向量输入上限·原文检索", ok: "已生成", failed: "生成失败·原文检索", budget: "预算不足·原文检索" };
const AUX_LABEL = { memory_contextualize: "记忆背景生成", memory_rerank: "记忆重排" };
const ui = {
  page: "chat", tab: "trace", run: null, events: [], source: null, selected: null, follow: true, open: new Set(),
  collapsed: new Set(), expanded: false, search: "", zoom: null, checked: new Set(), compare: [], compareSel: null,
  replay: null, ctxWindow: Number(load("ctxWindow")) || 128000, queued: false, sending: false, loading: false,
  inspectorTab: "overview",
};

// ---------- 小工具 ----------
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch {} }
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function parse(v) { if (typeof v !== "string") return v; try { return JSON.parse(v); } catch { return v; } }
function pretty(v) { v = parse(v); return typeof v === "string" ? v : JSON.stringify(v, null, 2); }
const compact = (v) => { v = parse(v); return typeof v === "string" ? v : JSON.stringify(v); };
const textOf = (m) => typeof m.content === "string" ? m.content : compact(m.content);
const callPosition = (c) => `Turn ${c.turn} · ${c.aux ? AUX_LABEL[c.purpose] || c.purpose : c.compact ? "上下文压缩" : "Step " + c.step}`;
// 摘要前的连续user是保留原话；只有摘要后的末尾user才可能是新问题。
function incomingUsers(messages) {
  let k = messages.length;
  while (k > 0 && messages[k - 1].role === "user") k--;
  const tail = messages.slice(k), summary = tail.findLastIndex((m) => textOf(m).startsWith(SUMMARY_PREFIX));
  return tail.slice(summary + 1);
}
const clip = (t, n) => (t = String(t ?? "").replace(/\s+/g, " ")).length > n ? t.slice(0, n) + "…" : t;
const sec = (ms) => ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : Math.round(ms) + " ms";
const kfmt = (n) => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
function fold(title, value, open) {
  const box = el("details"); box.open = !!open;
  box.append(el("summary", "", title), el("pre", "", pretty(value)));
  return box;
}
function section(title, ...children) {
  const box = el("div", "section");
  box.append(el("div", "label", title), ...children);
  return box;
}

// 请求/响应来自代理实际记录的body；只格式化展示，不裁剪字段或把模型文本当HTML执行。
function rawCode(text) {
  const pre = el("pre", "raw-code");
  text.split("\n").forEach((line, i) => {
    const row = el("span", "raw-line"); row.dataset.line = i + 1;
    const tokens = /"(?:\\.|[^"\\])*"|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|\b(?:true|false|null)\b/g;
    let end = 0;
    for (const m of line.matchAll(tokens)) {
      row.append(line.slice(end, m.index));
      const cls = m[0][0] === '"' ? (/^\s*:/.test(line.slice(m.index + m[0].length)) ? "raw-key" : "raw-string") : /^(true|false|null)$/.test(m[0]) ? "raw-value" : "raw-number";
      row.append(el("span", cls, m[0])); end = m.index + m[0].length;
    }
    row.append(line.slice(end)); pre.append(row);
  });
  return pre;
}
function rawCard(kind, value, caption) {
  const card = el("section", "raw-card " + kind), head = el("div", "raw-card-head");
  const text = value === undefined ? "" : pretty(value);
  const copyLabel = typeof value === "string" ? "复制内容" : "复制 JSON";
  const copy = el("button", "raw-copy", copyLabel); copy.type = "button"; copy.disabled = value === undefined;
  copy.setAttribute("aria-label", kind === "input" ? "复制原始输入" : "复制原始输出");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text); copy.textContent = "已复制 ✓"; }
    catch { copy.textContent = "请手动选择复制"; }
    setTimeout(() => { copy.textContent = copyLabel; }, 1800);
  };
  head.append(el("span", "raw-pill", kind === "input" ? "IN" : "OUT"), el("strong", "", kind === "input" ? "原始输入" : "原始输出"), copy);
  card.append(head, el("div", "raw-caption", caption), value === undefined ? el("div", "raw-wait", "等待模型响应，返回后自动显示…") : rawCode(text));
  return card;
}
function rawIO(c, runID) {
  const key = `raw:${runID}:${c.n}`, button = el("button", "raw-toggle", "原始输入 / 输出"), panel = el("div", "raw-io");
  button.type = "button";
  button.setAttribute("aria-label", `${callPosition(c)} · 请求 #${c.n} 原始输入 / 输出`);
  const show = (open) => {
    panel.hidden = !open; button.setAttribute("aria-expanded", String(open));
    panel.replaceChildren();
    if (!open) return;
    const grid = el("div", "raw-grid");
    const output = c.end ? c.rawBody !== undefined ? c.rawBody : c.errorText || c.res : undefined;
    grid.append(rawCard("input", c.req, `${(c.req.messages || []).length} 条 messages · ${(c.req.tools || []).length} 个工具 · ${c.req.model || ""}`),
      rawCard("output", output, c.end ? `HTTP ${c.status} · ${sec(c.ms)}${c.choice ? " · " + c.choice.finish_reason : ""}` : "请求进行中"));
    const note = el("div", "raw-note"); note.append(el("span", "raw-dot"), "模型调用的完整请求体与响应体 · 格式化展示");
    panel.append(note, grid);
  };
  button.onclick = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    ui.open.has(key) ? ui.open.delete(key) : ui.open.add(key);
    show(ui.open.has(key));
  };
  show(ui.open.has(key));
  return { button, panel };
}
function message(m) {
  const box = el("div", "msg " + m.role);
  const summary = m.role === "user" && String(m.content).startsWith(SUMMARY_PREFIX);
  box.append(el("div", "role", m.role + (summary ? " · 历史摘要" : "")));
  if (m.content) box.append(el("div", "text", typeof m.content === "string" ? m.content : pretty(m.content)));
  if (m.tool_calls && m.tool_calls.length) box.append(fold("工具调用请求", m.tool_calls, true));
  if (m.tool_call_id) box.append(el("div", "meta", "tool_call_id: " + m.tool_call_id));
  if (m.reasoning_content || m.encrypted_content) box.append(el("div", "meta", "包含原始推理字段，可在原始输入 JSON 中查看"));
  return box;

// ---------- 统一的事件项：轨迹行、迷宫节点、对比格子都指向它 ----------

        sum: !c.end ? "等待模型响应…" : !c.choice ? `HTTP ${c.status} ` + clip(c.errorText || compact(c.res), 80) : AUX_LABEL[c.purpose] + "：" + clip(m.content, 100),

    if (c.userMessage) list.push({ id: "u" + c.turn, type: "user", ...where, step: 0, label: "USER", sum: textOf(c.userMessage), message: c.userMessage });
    // 完整输入是每次请求的快照，保留详情入口；主表只展示新发生的事件。
    list.push({ id: "in" + c.n, type: "input", ...where, hidden: true, label: "模型输入",
      sum: `${messages.length} 条 messages · ${messages.map((m) => m.role).join(" → ")}` });

function bindRuler(ruler, from, span) {
  let startX = null, sel = null;

  ruler.onpointermove = (ev) => {
    if (startX === null) return;
    const x = frac(ev);
    sel.style.left = Math.min(x, startX) * 100 + "%";
    sel.style.width = Math.abs(x - startX) * 100 + "%";
  };
  ruler.onpointerup = (ev) => {
    if (startX === null) return;
    const x = frac(ev), lo = Math.min(x, startX), hi = Math.max(x, startX);

    if (hi - lo > 0.02) ui.zoom = [from + lo * span, from + hi * span];
    render();
  };
  ruler.ondblclick = () => { ui.zoom = null; render(); };
}

function stopReplay() {

// 按真实时间间隔重放已结束的运行；折叠空闲时，单个间隔最多按 0.4 秒播放。
function startReplay() {
  if (!ui.run || !ui.run.exit || ui.tab === "compare") return;
  const events = ui.events.slice(), speed = Number($("speed").value), foldIdle = $("fold").checked;
  Object.assign(ui, { run: newRun(ui.run.id), follow: true, zoom: null, replay: { i: 0 } });
  const step = () => {
    if (!ui.replay) return;
    const e = events[ui.replay.i++];
    apply(ui.run, e);
    if (ui.replay.i >= events.length) ui.replay = null;
    render();
    if (!ui.replay) return;
    let gap = Date.parse(events[ui.replay.i].time) - Date.parse(e.time);
    if (foldIdle) gap = Math.min(gap, 400 * speed);
    ui.replay.timer = setTimeout(step, Math.max(0, gap / speed));

// ---------- 对话流：从同一批模型请求还原用户消息、思考、工具和回答 ----------
// 只渲染少量 Markdown：先转义再替换，模型输出不能注入 HTML。
function md(text) {
  const lines = String(text || "").split("\n"), out = [];
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const block = /^(```|#{1,6}\s|\s*([-*]|\d+\.)\s|\|)/;
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if (/^#{1,6}\s/.test(line)) {
      out.push(`<h4>${inline(line.replace(/^#+\s*/, ""))}</h4>`); i++;
    } else if (/^\s*([-*]|\d+\.)\s/.test(line)) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul", items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i]); i++) items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s/, ""))}</li>`);
      out.push(`<${tag}>${items.join("")}</${tag}>`);
    } else if (line.startsWith("|")) {
      const rows = [];
      for (; i < lines.length && lines[i].startsWith("|"); i++) {
        if (/^\|[\s:|-]+\|?\s*$/.test(lines[i])) continue;
        const cells = lines[i].trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
        const tag = rows.length ? "td" : "th";
        rows.push("<tr>" + cells.map((c) => `<${tag}>${c}</${tag}>`).join("") + "</tr>");
      }
      out.push(`<table>${rows.join("")}</table>`);
    } else if (!line.trim()) i++;
    else {
      const para = [];
      for (; i < lines.length && lines[i].trim() && !block.test(lines[i]); i++) para.push(inline(lines[i]));
      out.push(`<p>${para.join("<br>")}</p>`);
    }
  }
  const box = el("div", "md");
  box.innerHTML = out.join("");
  return box;
}

    const k = part.indexOf("=");
    if (k > 0) out[part.slice(0, k)] = part.slice(k + 1);
  }
  return out;

    row.append(el("b", "", MEM_TYPE[m.type] || m.type), el("span", "", f.content || f.reason || m.text), el("span", "meta", meta));

    head.append(el("strong", "", m.id), el("span", "mem-kind", MEM_KIND[m.kind] || m.kind), el("span", "meta", `${MEM_SOURCE[m.source] || m.source} · 重要性 ${m.importance}`), del);
    const derived = chunks.filter((c) => c.memory_id === m.id).sort((a, b) => a.plan.localeCompare(b.plan) || a.chunk - b.chunk);
    const details = [];
    for (const c of derived) details.push(el("div", "meta", `[${c.plan} · 片段 ${c.chunk}/${c.chunks} · ${MEM_STATUS[c.status] || c.status}] ` + (c.context ? "背景：" + c.context : c.reason || "") + (c.chunks > 1 ? " ｜ 片段：" + c.text : "")));
    if (!derived.length) details.push(el("div", "meta", "还没有索引：下次检索时建立"));
    details.push(m.source_context ? fold(`来源上下文 · ${when(m.source_context.time)}` + (m.source_context.truncated ? " · 已省略更早部分" : ""), m.source_context.text) : el("div", "meta", "来源：无（升级前写入的旧记忆，不猜测来源，按原文检索）"));
    card.append(head, el("div", "mem-text", m.content), ...details, el("div", "meta", `创建 ${when(m.created_at)} · 最近访问 ${when(m.last_access)} · ` + (m.expire_at ? (expired ? "已过期，下次读写时删除" : "过期于 " + when(m.expire_at)) : "不过期")));
    panel.append(card);
  }
}

async function loadEnabled() {
  try { const res = await fetch("/hub/enabled"); if (res.ok) ui.hub = await res.json(); } catch {}
  syncComposer();
}
async function hubCall(method, url, body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) throw new Error(await res.text());
  return res;
}
function hubToggle(enabled, onchange) {
  const label = el("label", "switch"), box = el("input");
  box.type = "checkbox"; box.checked = enabled;
  box.onchange = async () => { box.disabled = true; try { await onchange(box.checked); } catch (err) { alert(err.message); box.checked = !box.checked; } box.disabled = false; loadEnabled(); };
  label.append(box, enabled ? "已启用" : "已停用");
  return label;
}
// 两个中心都在对话区展示，和“长期记忆”一样；数据来自 agent 自己的 -skills-list 与 -mcp-list。

  $("thread").replaceChildren(panel);
  panel.append(el("h2", "", title), el("p", "meta", intro), el("div", "meta", "读取中…"));

}
async function openSkills() {
  const panel = await openHubPage("Skills 中心", "skills/*/SKILL.md · 由 agent 的 -skills-list 解析和校验 · 开关保存在 .data/hub.json。新对话勾选 Skills 时，打开的 skill 只把名字和用途写进 system；模型判断任务相关时调用 load_skill 读取正文。只支持知识型 skill，不执行脚本。");
  if (!panel) return;
  let data;
  try { data = await (await hubCall("GET", "/hub")).json(); }
  catch (err) { panel.lastChild.replaceWith(el("div", "err", "读取失败：" + err.message)); return; }
  if (!panel.isConnected) return;
  const bar = el("div", "hub-bar"), add = el("button", "ghost", "＋ 新建 skill"), form = el("form", "hub-form");
  form.hidden = true;
  add.onclick = () => { form.hidden = !form.hidden; };
  bar.append(add, el("span", "meta", `${data.skills.length} 个可用` + (data.skill_errors.length ? ` · ${data.skill_errors.length} 个未通过校验` : "")));
  const name = el("input"), desc = el("input"), body = el("textarea"), submit = el("button", "ghost", "创建");
  name.placeholder = "name：小写字母、数字、连字符，如 commit-message"; desc.placeholder = "description：一行，写清做什么、什么时候用（模型靠它判断是否加载）";
  body.placeholder = "# 标题\n\n## 步骤\n1. …\n\n## 输出格式\n…";
  const row = el("div", "row"); row.append(submit, el("span", "meta", "写入 skills/<name>/SKILL.md，随后用 agent 的校验检查；不合规会撤销并给出原因"));
  form.append(name, desc, body, row);
  form.onsubmit = async (ev) => {
    ev.preventDefault(); submit.disabled = true;
    try { await hubCall("POST", "/hub/skills", { name: name.value, description: desc.value, body: body.value }); openSkills(); }
    catch (err) { alert(err.message); submit.disabled = false; }
  };
  panel.lastChild.replaceWith(bar);
  panel.append(form);
  if (!data.skills.length && !data.skill_errors.length) panel.append(el("div", "empty", "还没有 skill。点“新建 skill”写一份操作指南。"));
  for (const sk of data.skills) {
    const card = el("article", "hub-card" + (sk.enabled ? "" : " off")), head = el("div", "hub-head"), push = el("div", "push"), del = el("button", "ghost", "删除");
    del.onclick = async () => {
      if (!confirm(`删除 skills/${sk.name}/ 整个目录？无法撤销。`)) return;
      try { await hubCall("DELETE", `/hub/skills/${sk.name}`); openSkills(); loadEnabled(); } catch (err) { alert(err.message); }
    };
    push.append(hubToggle(sk.enabled, async (on) => { await hubCall("POST", `/hub/skills/${sk.name}/enabled`, { enabled: on }); openSkills(); }), del);
    head.append(el("strong", "", sk.name), push);
    const full = el("details", "step"), sum = el("summary"), inner = el("div", "body");
    sum.append(el("span", "", `SKILL.md 正文 · ${sk.body.length} 字（load_skill 返回的内容）`)); inner.append(md(sk.body)); full.append(sum, inner);
    card.append(head, el("div", "hub-desc", sk.description), el("div", "cmd", sk.path), full);
    panel.append(card);
  }
  for (const bad of data.skill_errors) {

    head.append(el("strong", "", bad.dir), el("span", "err", "未通过校验，agent 启动时跳过"));
    card.append(head, el("div", "hub-desc", bad.error), el("div", "cmd", bad.path));
    panel.append(card);
  }
}
// 预设统一从源码启动，在项目根目录执行，无需提前准备可执行文件。
const MCP_PRESETS = [["observer", location.origin + "/mcp", "观测台内置的远程 MCP server（Streamable HTTP），工具是 agent 的 calculator"], ["everything", "go run github.com/mark3labs/mcp-go/examples/everything@v1.1.1", "Day 6 示例 server；首次运行会下载并编译"], ["calculator", "go run . -mcp-serve", "Day 7 本项目 server，始终用当前源码"]];
async function openMCP() {
  const panel = await openHubPage("MCP 中心", "两种 server：填 http(s) 地址是远程 server（Streamable HTTP，每条消息一个 POST）；填命令是本地 stdio server（相对 agent 目录执行，按空格切分、不经过 shell）。配置保存在 .data/hub.json。新对话勾选 MCP 时，打开的 server 由 agent 逐个连接，工具注册为 mcp_<原名>；连不上的 server 跳过，与已有工具重名的工具跳过。");
  if (!panel) return;
  let data;
  try { data = await (await hubCall("GET", "/hub/enabled")).json(); }
  catch (err) { panel.lastChild.replaceWith(el("div", "err", "读取失败：" + err.message)); return; }
  if (!panel.isConnected) return;
  const form = el("form", "hub-form"), name = el("input"), command = el("input"), submit = el("button", "ghost", "添加 server");
  name.placeholder = "name：如 observer"; command.placeholder = "远程地址如 " + location.origin + "/mcp；或 stdio 命令如 go run . -mcp-serve";
  const presets = el("div", "row");
  presets.append(el("span", "meta", "快速填入："));
  for (const [n, c, tip] of MCP_PRESETS) { const b = el("button", "link", n); b.type = "button"; b.title = tip; b.onclick = () => { name.value = n; command.value = c; }; presets.append(b); }
  const row = el("div", "row"); row.append(submit, el("span", "meta", "添加后默认启用；先点“测试连接”看协商结果和工具列表"));
  form.append(presets, name, command, row);
  form.onsubmit = async (ev) => {
    ev.preventDefault(); submit.disabled = true;
    try { await hubCall("POST", "/hub/mcp", { name: name.value, command: command.value }); openMCP(); loadEnabled(); }
    catch (err) { alert(err.message); submit.disabled = false; }
  };
  panel.lastChild.replaceWith(form);
  if (data.hosted) panel.insertBefore(el("div", "banner", `观测台内置远程 MCP server：${location.origin}/mcp · ${data.hosted}。它把 agent 的 calculator 以 Streamable HTTP 提供出来；要在对话里使用，用“快速填入 → observer”添加。`), form);
  if (!data.mcp_servers.length) panel.append(el("div", "empty", "还没有 MCP server。用上面的表单添加一个。"));
  for (const m of data.mcp_servers) {
    const card = el("article", "hub-card" + (m.enabled ? "" : " off")), head = el("div", "hub-head"), push = el("div", "push");
    const test = el("button", "ghost", "测试连接"), del = el("button", "ghost", "删除"), out = el("div");
    test.onclick = async () => {
      test.disabled = true; out.replaceChildren(el("div", "shimmer", "agent -mcp-list 连接中…"));
      try {
        const result = await (await hubCall("POST", `/hub/mcp/${m.name}/test`)).json();
        const lines = result.output.split("\n"), count = lines.map((l) => /^MCP tools\/list: count=(\d+)/.exec(l)).find(Boolean);
        const hint = /exec format error/.test(result.output) ? "：请使用上方的源码启动预设，或重新构建后重试" : "";
        out.replaceChildren(el("div", result.ok ? "meta" : "err", result.ok ? `连接成功 · ${count ? count[1] : "?"} 个工具` : "连接失败" + hint), el("pre", result.ok ? "" : "err", result.output.trim()));
      } catch (err) { out.replaceChildren(el("div", "err", err.message)); }
      test.disabled = false;
    };
    del.onclick = async () => {
      if (!confirm(`从配置中删除 ${m.name}？不会删除它的程序文件。`)) return;
      try { await hubCall("DELETE", `/hub/mcp/${m.name}`); openMCP(); loadEnabled(); } catch (err) { alert(err.message); }
    };
    push.append(hubToggle(m.enabled, async (on) => { await hubCall("POST", `/hub/mcp/${m.name}/enabled`, { enabled: on }); openMCP(); }), test, del);
    head.append(el("strong", "", m.name), push);
    card.append(head, el("div", "cmd", m.command), out);
    panel.append(card);
  }
}

};
$("send").onclick = async (ev) => {
  if (!$("send").classList.contains("stop")) return; // 发送仍走表单提交
  ev.preventDefault();
