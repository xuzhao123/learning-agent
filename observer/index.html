<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Agent</title>
<style>
:root {
  --bg: #ffffff; --side: #f6f6f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e76; --line: #e4e4e7; --soft: #f1f1f3;
  --accent: #2f6fde; --ok: #0f8a6a; --err: #d1490f; --warn: #c88a04; --think: #7c5cc4; --cache: #a3acb9; --code: #f4f4f5;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181818; --side: #121212; --panel: #1f1f1f; --text: #ececec; --muted: #9a9aa2; --line: #2e2e33; --soft: #26262a;
    --accent: #6f9ef5; --ok: #3cc39d; --err: #f0864a; --warn: #e5b53e; --think: #a98cf0; --cache: #5d6573; --code: #232326;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; }

/* 左侧：对话列表 */
#sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.brand { padding: 14px 16px 8px; font-weight: 650; letter-spacing: .01em; }
.navbtn { display: flex; align-items: center; gap: 8px; margin: 2px 8px; padding: 7px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.navbtn:hover { background: var(--soft); }
.navbtn .ico { width: 18px; text-align: center; color: var(--muted); }
.navlabel { display: flex; justify-content: space-between; padding: 14px 18px 4px; font-size: 12px; color: var(--muted); }
#runs { flex: 1; overflow: auto; padding: 0 8px 12px; }
.runitem { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
.runitem:hover { background: var(--soft); }
.runitem.active { background: color-mix(in srgb, var(--text) 9%, transparent); }
.runitem input { margin: 0; }
.runitem button { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; }
.runitem .q { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runitem small { color: var(--muted); font-size: 11px; }
.live { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--ok); animation: pulse 1.1s ease-in-out infinite; }

/* 顶栏 */
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
#menu { display: none; border: 0; background: none; font-size: 18px; padding: 4px; }
#title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--soft); }
.seg button { border: 0; background: none; padding: 3px 14px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; }
#status.bad { color: var(--err); }

/* 对话流 */
#chat-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#chat-scroll { flex: 1; overflow: auto; }
#thread { max-width: 780px; margin: 0 auto; padding: 28px 24px 32px; }
.u { display: flex; justify-content: flex-end; margin: 22px 0 14px; }
.u div { max-width: 82%; padding: 9px 14px; border-radius: 16px; background: var(--soft); white-space: pre-wrap; word-break: break-word; }
.banner { margin: 8px 0 20px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 13px; }
.a { margin: 4px 0 8px; }
.step { margin: 2px 0; font-size: 13px; color: var(--muted); }
.step > summary { display: flex; align-items: center; gap: 8px; padding: 3px 0; list-style: none; cursor: pointer; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary::after { content: "›"; transition: transform .15s; }
.step[open] > summary::after { transform: rotate(90deg); }
.step > summary:hover { color: var(--text); }
.step > summary > span { white-space: nowrap; }
.step .body { margin: 4px 0 10px 22px; padding-left: 12px; border-left: 2px solid var(--line); }
.step .ico { width: 14px; text-align: center; flex: none; }
.step .ok { color: var(--ok); } .step .bad { color: var(--err); }
.tname { color: var(--text); font-family: var(--mono); font-size: 12.5px; }
.targs { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
.reason { white-space: pre-wrap; word-break: break-word; font-size: 13px; color: var(--muted); max-height: 360px; overflow: auto; }
.shimmer { display: inline-block; margin: 6px 0; font-size: 13px; background: linear-gradient(90deg, var(--muted) 30%, var(--text) 50%, var(--muted) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.6s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
.spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.md { margin: 6px 0; word-break: break-word; }
.md p { margin: 0 0 10px; }
.md h3, .md h4, .md h5, .md h6 { margin: 16px 0 6px; font-size: 15px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md code { padding: 1px 5px; border-radius: 4px; background: var(--code); font: 12.5px var(--mono); }
.md pre code { padding: 0; background: none; }
.md table { border-collapse: collapse; margin: 0 0 10px; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.md.mid { color: var(--muted); }
.answer-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 2px 0 10px; font-size: 12px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }
.link:hover { color: var(--accent); }
.divider { margin: 18px 0; font-size: 12px; color: var(--muted); }
.divider > summary { display: flex; align-items: center; gap: 10px; list-style: none; cursor: pointer; }
.divider > summary::-webkit-details-marker { display: none; }
.divider > summary::before, .divider > summary::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.divider .body { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--soft); }
.stopcard { margin: 12px 0; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--err) 45%, var(--line)); border-radius: 10px; font-size: 13px; }
.welcome { padding: 18vh 0 0; text-align: center; }
.welcome h1 { margin: 0 0 18px; font-size: 24px; font-weight: 600; }
.sugs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.sugs button { max-width: 340px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 13px; text-align: left; }
.sugs button:hover { color: var(--text); border-color: var(--muted); }

/* 输入框 */
#composer-wrap { flex: none; padding: 0 24px 14px; }
#composer { max-width: 780px; margin: 0 auto; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 2px 12px rgba(0,0,0,.06); }
#composer:focus-within { border-color: color-mix(in srgb, var(--text) 30%, var(--line)); }
#query { display: block; width: 100%; max-height: 220px; padding: 12px 16px 4px; border: 0; outline: 0; resize: none; background: none; }
.crow { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 14px; }
#mode-chip { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
#send { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 16px; font-weight: 700; }
#send:disabled { opacity: .25; cursor: default; }
#hint { max-width: 780px; margin: 6px auto 0; font-size: 11px; color: var(--muted); text-align: center; }

/* 观测 */
#observe-pane { flex: 1; overflow: auto; padding: 12px 16px; background: var(--side); font-size: 13px; line-height: 1.55; }
.obs-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 12px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.side { position: sticky; top: 0; max-height: calc(100vh - 76px); overflow: auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; background: var(--soft); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tabs button:disabled { opacity: .4; cursor: default; }
.toolbar .grow { flex: 1; }
.toolbar input[type=search], .toolbar select, .trackhead input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 8px; }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.stats span { color: var(--muted); font-size: 12px; }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.stats b.good { color: var(--ok); }
.stats b.bad { color: var(--err); }
.empty { color: var(--muted); padding: 48px 16px; text-align: center; }

/* 轨迹：事件账本 + 瀑布时间轴 */
.lrow { display: grid; grid-template-columns: 38px 74px minmax(0, 1fr) 64px 64px minmax(120px, 34%); gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lrow:hover { background: var(--soft); }
.lrow.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.lrow.headrow { position: sticky; top: 0; z-index: 1; background: var(--panel); cursor: default; color: var(--muted); font-size: 12px; }
.lrow .num, .lrow .tok, .lrow .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
.lrow .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .sum.err { color: var(--err); }
.turn { display: flex; gap: 12px; align-items: center; padding: 6px 10px; background: var(--soft); border-bottom: 1px solid var(--line); cursor: pointer; font-weight: 600; }
.turn .meta { font-weight: 400; }
.badge { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; text-align: center; color: #fff; background: var(--muted); }
.badge.system, .badge.history, .badge.tools { background: var(--cache); } .badge.user, .badge.answer { background: var(--accent); }
.badge.message, .badge.assistant { background: var(--think); } .badge.tool { background: var(--ok); }
.badge.process { background: var(--text); color: var(--panel); } .badge.bad { background: var(--err); }
.track { position: relative; height: 16px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%); }
.bar { position: absolute; top: 3px; height: 10px; border-radius: 2px; min-width: 2px; }
.bar.model { background: var(--think); } .bar.tool { background: var(--ok); } .bar.bad { background: var(--err); }
.running { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.ruler { position: relative; height: 18px; cursor: crosshair; user-select: none; }
.ruler span { position: absolute; top: 0; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.ruler .sel { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 25%, transparent); }

/* 迷宫与数据轨 */
.scroll { overflow-x: auto; }
svg text { fill: var(--text); font: 11px -apple-system, "PingFang SC", sans-serif; }
svg .muted { fill: var(--muted); }
svg .spine { stroke: var(--accent); stroke-width: 3; fill: none; }
svg .edge { stroke-width: 2; fill: none; }
svg .edge.main { stroke: var(--ok); }
svg .edge.detour { stroke: var(--err); stroke-dasharray: 4 3; }
svg .back { stroke: var(--think); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
svg .n { cursor: pointer; }
svg .n.model circle { fill: var(--accent); }
svg .n.model.bad circle, svg .n.end.bad circle { fill: var(--err); }
svg .n.main rect { fill: color-mix(in srgb, var(--ok) 22%, var(--panel)); stroke: var(--ok); }
svg .n.detour rect { fill: color-mix(in srgb, var(--err) 18%, var(--panel)); stroke: var(--err); }
svg .n.final circle { fill: var(--think); }
svg .n.end circle { fill: var(--text); }
svg .n.sel circle, svg .n.sel rect { stroke: var(--warn); stroke-width: 3; }
svg .white { fill: #fff; font-weight: 700; }
svg .x { stroke: var(--err); stroke-width: 2; }
svg .grid { stroke: var(--line); }
svg .lim70 { stroke: var(--warn); stroke-dasharray: 4 3; } svg .lim90 { stroke: var(--err); stroke-dasharray: 4 3; }
svg .curve { stroke: var(--accent); stroke-width: 2; fill: none; }
svg .dot { fill: var(--accent); }
svg .f-cache { fill: var(--cache); } svg .f-input { fill: color-mix(in srgb, var(--accent) 55%, var(--panel)); }
svg .f-think { fill: var(--think); } svg .f-out, svg .f-main { fill: var(--ok); } svg .f-detour { fill: var(--err); }
svg .warn { fill: var(--warn); }
.trackhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 12px 0; font-weight: 600; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-weight: 400; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.list { padding: 10px 12px 12px; }
.list .item { padding: 3px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }

/* 对比 */
.cmp { width: 100%; border-collapse: collapse; }
.cmp th, .cmp td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-variant-numeric: tabular-nums; }
.cmp th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
.cmp td.best { color: var(--ok); font-weight: 600; }
.lanes { display: grid; gap: 6px; padding: 10px 12px; }
.lane { display: grid; gap: 6px; }
.cell { background: var(--soft); border-radius: 6px; padding: 6px; min-height: 52px; cursor: pointer; }
.cell.none { background: transparent; border: 1px dashed var(--line); cursor: default; }
.lanehead { color: var(--muted); font-size: 11px; padding: 4px 0; overflow: hidden; }
.chip { display: inline-block; margin: 2px 2px 0 0; padding: 0 6px; border-radius: 10px; font-size: 11px; border: 1px solid var(--ok); color: var(--ok); cursor: pointer; }
.chip.detour { border-color: var(--err); color: var(--err); }
.chip.answer { border-color: var(--think); color: var(--think); }

/* 详情面板 */
.ins .top { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ins .top strong { font-size: 14px; }
.section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.section:last-child { border-bottom: 0; }
.label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.msg { border-left: 3px solid var(--line); padding: 2px 10px; margin: 6px 0; }
.msg .role { font-size: 12px; font-weight: 600; color: var(--muted); }
.msg.user { border-color: var(--accent); }
.msg.think { border-color: var(--think); color: var(--muted); }
.text { white-space: pre-wrap; word-break: break-word; }
.err { color: var(--err); }
pre { margin: 4px 0 0; padding: 8px 10px; background: var(--code); border-radius: 6px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 440px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.log .stderr { color: var(--err); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; }
.kv span:nth-child(odd) { color: var(--muted); }


@media (max-width: 1180px) {
  .obs-grid { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; }
  .lrow { grid-template-columns: 30px 64px minmax(0, 1fr) 54px 54px; }
  .lrow .track, .lrow .rulerwrap { display: none; }
}
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { position: fixed; z-index: 20; inset: 0 auto 0 0; width: 270px; transform: translateX(-100%); transition: transform .2s; }
  body.nav-open #sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  #menu { display: block; }
  #status { display: none; }
  #thread { padding: 20px 16px 24px; }
  #composer-wrap { padding: 0 16px 12px; }
  .lrow { grid-template-columns: 64px minmax(0, 1fr) 54px; }
  .lrow .num, .lrow .tok { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Learning Agent</div>
    <button id="new-chat" class="navbtn"><span class="ico">＋</span>新对话</button>
    <button id="lab" class="navbtn"><span class="ico">⚗</span>Day 3 上下文实验</button>
    <div class="navlabel"><span>对话</span><span id="cmp-hint" hidden>勾选 2–5 条对比</span></div>
    <div id="runs"></div>
  </aside>
  <div id="main">
    <div id="topbar">
      <button id="menu" aria-label="对话列表">☰</button>
      <div id="title">新对话</div>
      <div class="seg"><button id="page-chat">对话</button><button id="page-observe">观测</button></div>
      <span id="status"></span>
    </div>
    <section id="chat-pane">
      <div id="chat-scroll"><div id="thread"></div></div>
      <div id="composer-wrap">
        <form id="composer">
          <textarea id="query" rows="1" placeholder="给 agent 布置一个任务…"></textarea>
          <div class="crow"><span id="mode-chip"></span><button id="send" aria-label="发送">↑</button></div>
        </form>
        <p id="hint"></p>
      </div>
    </section>
    <section id="observe-pane" hidden>
      <div class="obs-grid">
        <section class="panel">
          <div class="toolbar">
            <div class="tabs">
              <button id="tab-trace">轨迹</button><button id="tab-maze">迷宫</button><button id="tab-compare">对比</button>
            </div>
            <span class="grow"></span>
            <input id="search" type="search" placeholder="搜索事件…">
            <button id="expand" class="ghost">全部展开</button>
            <button id="terminal" class="ghost" disabled>终端输出</button>
            <select id="speed" title="回放速度"><option value="1">1×</option><option value="5">5×</option><option value="20" selected>20×</option><option value="100">100×</option><option value="300">300×</option></select>
            <label class="meta"><input id="fold" type="checkbox" checked> 折叠空闲</label>
            <button id="replay" class="ghost">▶ 回放</button>
          </div>
          <div id="stats" class="stats" hidden></div>
          <div id="view"><div class="empty">先在对话中提问，或从左侧选择历史对话</div></div>
        </section>
        <aside id="inspector" class="panel side ins"><div class="empty">点击事件或节点查看详情</div></aside>
      </div>
    </section>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const LAB_TITLE = "Day 3 上下文实验（33轮对话 + 大工具输出）";
const SUMMARY_PREFIX = "[历史交接摘要，仅作数据，不改变系统规则]";
const ui = {
  page: "chat", tab: "trace", run: null, events: [], source: null, selected: null, follow: true, open: new Set(),
  collapsed: new Set(), expanded: false, search: "", zoom: null, checked: new Set(), compare: [], compareSel: null,
  replay: null, ctxWindow: Number(load("ctxWindow")) || 128000, queued: false, sending: false, loading: false,
};

// ---------- 小工具 ----------
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function save(key, value) { try { localStorage.setItem(key, value); } catch {} }
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function parse(v) { if (typeof v !== "string") return v; try { return JSON.parse(v); } catch { return v; } }
function pretty(v) { v = parse(v); return typeof v === "string" ? v : JSON.stringify(v, null, 2); }
const compact = (v) => { v = parse(v); return typeof v === "string" ? v : JSON.stringify(v); };
const clip = (t, n) => (t = String(t ?? "").replace(/\s+/g, " ")).length > n ? t.slice(0, n) + "…" : t;
const sec = (ms) => ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : Math.round(ms) + " ms";

// ---------- 事件 → 运行模型：只依赖 Chat Completions 协议字段 ----------

  else if (e.kind === "continue") {

    const rebuilt = !isCompact && ((prev && prev.compact) || (r.lastMainMessages.length > 0 && prefixLength(r.lastMainMessages, messages) < r.lastMainMessages.length));
    // 压缩后的消息数可能变短；按调用ID在所有历史请求中关联结果，不能依赖旧数组长度。
    for (const m of messages) if (m.role === "tool") {
      const t = r.calls.flatMap((c) => c.tools).find((t) => t.id === m.tool_call_id && !t.done);

  } else if (e.kind === "response") {

    const body = e.body || {};

      choice: (body.choices || [])[0], usage: body.usage || {} });
    const m = (c.choice && c.choice.message) || {};
    c.invalidSummary = c.compact && (m.tool_calls || []).length > 0;
    c.tools = (c.compact ? [] : (m.tool_calls || [])).map((t, i) => ({ id: t.id, name: t.function.name, args: t.function.arguments, start: time, call: c, index: i }));

// ---------- 确定性分析：主路径、绕路、回退（不调用模型） ----------

// ---------- 统一的事件项：轨迹行、迷宫节点、对比格子都指向它 ----------
// 系统规则独立计数；历史包括上一轮assistant回答，不能只看两次请求的共同前缀。

      if (role === "user") {

        cut = Math.max(cut, summary + 1);

    system: messages.filter((m) => m.role === "system"),

    if (c.n === 1 && system.length) list.push({ id: "system", type: "system", turn: 1, run: r, call: c, label: "system", sum: system[0].content, message: system[0] });
    current.filter((m) => m.role !== "tool").forEach((m, i) => list.push({ id: `in${c.n}-${i}`, type: m.role, turn: c.n, run: r, call: c,
      label: m.role, sum: m.content, message: m, origin: c.compact ? "压缩指令（程序追加）" : "本轮输入" }));
    if (c.n === 1 && c.req.tools) list.push({ id: "tools", type: "tools", turn: 1, run: r, call: c, label: "tools", sum: c.req.tools.map((t) => t.function ? t.function.name : "?").join("、") });
    const m = (c.choice && c.choice.message) || {};

    else if (c.end) sum = think + (c.compact ? "上下文摘要：" + clip(m.content, 80) : c.tools.length ? "调用 " + c.tools.map((t) => t.name).join("、") : "回答：" + clip(m.content, 80));

}

// ---------- 渲染入口 ----------

}

  $("tab-compare").disabled = ui.checked.size < 2;

// ---------- 视图一：Trajectory 事件账本 + 瀑布时间轴 ----------
function renderTrace(r, a, list) {
  const view = $("view");

  const [from, to] = ui.zoom || [0, total];
  const span = Math.max(1, to - from);
  const head = el("div", "lrow headrow");
  const rulerWrap = el("div", "rulerwrap");
  const ruler = el("div", "ruler");
  ruler.title = "在刻度上拖拽聚焦一段时间，双击还原";
  for (let i = 0; i <= 4; i++) {
    const s = el("span", "", sec(from + (span * i) / 4));
    s.style.left = i * 25 + "%";
    s.style.transform = i === 0 ? "none" : i === 4 ? "translateX(-100%)" : "translateX(-50%)";
    ruler.append(s);
  }
  bindRuler(ruler, from, span);
  rulerWrap.append(ruler);
  head.append(el("span", "num", "#"), el("span", "", "类型"), el("span", "", "内容摘要"), el("span", "tok", "tokens"), el("span", "dur", "耗时"), rulerWrap);
  view.append(head);
  const query = ui.search.trim().toLowerCase();
  let turn = 0, seq = 0;
  for (const it of list) {
    seq++;
    if (query && !(it.label + " " + it.sum).toLowerCase().includes(query)) continue;
    if (it.turn !== turn) {
      turn = it.turn;
      const c = r.calls[turn - 1];
      const open = query || ui.expanded || !ui.collapsed.has(turn);
      const t = el("div", "turn");
      t.append(el("span", "", (open ? "▾ " : "▸ ") + `Turn ${turn}`));
      if (c) {
        const d = a.detours.filter((x) => x.call === c).length;
        t.append(el("span", "meta", [c.ms ? sec(c.ms) : "进行中", c.usage.total_tokens ? kfmt(c.usage.total_tokens) + " tokens" : "",
          c.tools.length ? c.tools.length + " 个工具" : "", d ? d + " 处绕路" : ""].filter(Boolean).join(" · ")));
      }
      const n = turn;
      t.onclick = () => { ui.expanded = false; ui.collapsed.has(n) ? ui.collapsed.delete(n) : ui.collapsed.add(n); render(); };
      view.append(t);
    }
    if (!query && !ui.expanded && ui.collapsed.has(it.turn)) continue;
    const row = el("div", "lrow" + (it.id === ui.selected ? " selected" : ""));
    row.append(el("span", "num", seq), el("span", "badge " + it.type + (it.bad ? " bad" : ""), it.type === "tool" ? "tool" : it.label === "tools" ? "tools" : it.label === "compact" ? "摘要" : it.type),
      el("span", "sum" + (it.bad ? " err" : ""), (it.type === "tool" ? it.label + "  " : "") + clip(it.sum, 200)),
      el("span", "tok", it.tokens ? kfmt(it.tokens) : ""));
    const end = it.stop || (it.running ? r.last : null);
    row.append(el("span", "dur", it.start && end ? sec(end - it.start) : ""));
    const track = el("div", "track");
    if (it.start && end) {
      const left = (it.start - r.t0 - from) / span, width = (end - it.start) / span;
      if (left <= 1 && left + width >= 0) {
        const bar = el("div", `bar ${it.type === "tool" ? "tool" : "model"}${it.bad ? " bad" : ""}${it.running ? " running" : ""}`);
        bar.style.left = Math.max(0, left) * 100 + "%";
        bar.style.width = (Math.min(1, left + width) - Math.max(0, left)) * 100 + "%";
        bar.title = `开始 +${sec(it.start - r.t0)} · 持续 ${sec(end - it.start)}` + (it.type === "message" ? "（非流式响应，无法拆分 TTFT / decode）" : "");
        track.append(bar);

}
function bindRuler(ruler, from, span) {

  ruler.onpointerdown = (ev) => { startX = frac(ev); sel = el("div", "sel"); ruler.append(sel); ruler.setPointerCapture(ev.pointerId); };
  ruler.onpointermove = (ev) => {

}

// ---------- 视图二：dsh-maze 式探索迷宫 + 数据轨 ----------
const COL = 170, LEFT = 70, NODE_H = 26, GAP = 34;
const colX = (k) => LEFT + (k - 1) * COL;
function renderMaze(r, a, list) {
  const view = $("view");
  view.replaceChildren();
  if (!r.calls.length) return view.append(el("div", "empty", "等待第一次模型调用…"));
  const n = r.calls.length, last = r.calls[n - 1];
  const tailX = colX(n) + (last.tools.length ? COL : COL * 0.55);
  const width = tailX + 120;

    const base = spineY + (main.length ? ((main.length - 1) / 2) * GAP : 0) + GAP + 8;
    det.forEach((t, j) => pos.set(t, [x, base + j * GAP]));

  parts.push(`<line class="spine" x1="${colX(1)}" y1="${spineY}" x2="${tailX}" y2="${spineY}" opacity=".15"/>`);
  for (const c of r.calls) {
    const x0 = colX(c.n), x1 = c.n < n ? colX(c.n + 1) : tailX;

    if (c.tools.every((t) => t.detour)) parts.push(`<line class="spine" x1="${x0}" y1="${spineY}" x2="${x1}" y2="${spineY}"/>`);
    for (const t of c.tools) {
      const [x, y] = pos.get(t);
      if (!t.detour) parts.push(`<path class="edge main" d="M${x0},${spineY} C${x0 + 40},${spineY} ${x - 60},${y} ${x - 55},${y} M${x + 55},${y} C${x + 60},${y} ${x1 - 40},${spineY} ${x1},${spineY}"/>`);
      else parts.push(`<path class="edge detour" d="M${x0},${spineY} C${x0 + 30},${spineY} ${x - 70},${y} ${x - 55},${y} M${x + 55},${y} L${x + 70},${y}"/><path class="x" d="M${x + 68},${y - 5} l8,10 m0,-10 l-8,10"/>`);
    }
  }
  for (const b of a.backtracks) {

    const lift = Math.min(fy, ty) - 30;

  for (const c of r.calls) {

      `<text class="muted" x="${x}" y="${spineY + 30}" text-anchor="middle">${c.usage.total_tokens ? kfmt(c.usage.total_tokens) + " tok" : ""}</text>`));

        `<rect x="${tx - 55}" y="${ty - NODE_H / 2}" width="110" height="${NODE_H}" rx="6"/><text x="${tx}" y="${ty + 4}" text-anchor="middle">${esc((t.retryOf ? "↺ " : "") + clip(t.name, 14))}</text><title>${esc(t.name + (t.reason ? " · " + t.reason : ""))}</title>`));
    }
  }
  const ans = list.find((i) => i.id === "ans"), endItem = list.find((i) => i.id === "end");
  if (ans) parts.push(node("ans", "final", `<circle cx="${tailX}" cy="${spineY}" r="13"/><text class="white" x="${tailX}" y="${spineY + 4}" text-anchor="middle">A</text><text class="muted" x="${tailX}" y="${spineY + 30}" text-anchor="middle">回答</text>`));
  const ex = tailX + (ans ? 60 : 0);

  parts.push(node("end", "end" + (endItem.bad ? " bad" : "") + (r.exit ? "" : " running"), `<circle cx="${ex}" cy="${spineY}" r="9"/><text class="muted" x="${ex}" y="${spineY - 16}" text-anchor="middle">${esc(clip(r.exit || "运行中", 14))}</text>`));

  map.onclick = (ev) => { const g = ev.target.closest && ev.target.closest("[data-id]"); if (g) select(g.getAttribute("data-id")); };
  const head = el("div", "trackhead");
  head.append(el("span", "", "探索迷宫"), legend([["var(--accent)", "模型调用（主干）"], ["var(--ok)", "主路径工具"], ["var(--err)", "绕路：错误 / 空结果 / 重复"], ["var(--think)", "回退重试 ↺"]]));
  view.append(head, map, ...dataTracks(r, width));

  if (!a.detours.length) inv.append(el("div", "meta", "没有绕路：每次工具调用都返回了有效结果，也没有用相同参数重复调用。"));

}
function dataTracks(r, width) {
  const H = 70, pad = 14, x0 = LEFT - 30, x1 = width - 20;
  const svg = (inner, h) => { const box = el("div", "scroll"); box.innerHTML = `<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}">${inner}</svg>`; return box; };
  const baseline = `<line class="grid" x1="${x0}" y1="${H - pad}" x2="${x1}" y2="${H - pad}"/>`;
  // 1. 工具调用密度：每轮工具数，绕路部分标红
  const maxTools = Math.max(1, ...r.calls.map((c) => c.tools.length));
  let s = baseline;
  for (const c of r.calls) {
    if (!c.tools.length) continue;
    const x = colX(c.n) + COL / 2 - 10, unit = (H - 2 * pad) / maxTools;
    const det = c.tools.filter((t) => t.detour).length, ok = c.tools.length - det;
    s += `<rect class="f-main" x="${x}" y="${H - pad - ok * unit}" width="20" height="${ok * unit}"/>`;
    s += `<rect class="f-detour" x="${x}" y="${H - pad - c.tools.length * unit}" width="20" height="${det * unit}"/>`;
    s += `<text x="${x + 26}" y="${H - pad - c.tools.length * unit + 10}">${c.tools.length}</text>`;
  }
  const h1 = el("div", "trackhead");
  h1.append(el("span", "", "工具调用密度"), legend([["var(--ok)", "有效"], ["var(--err)", "绕路"]]));
  // 2. Token 脉冲：每次模型调用的 token 构成
  const maxTok = Math.max(1, ...r.calls.map((c) => c.usage.total_tokens || 0));
  let t = baseline;
  for (const c of r.calls) {
    const p = tokenParts(c.usage), unit = (H - 2 * pad) / maxTok;
    let y = H - pad;
    for (const [cls, v, name] of [["f-cache", p.cached, "缓存命中输入"], ["f-input", p.input, "未缓存输入"], ["f-think", p.reasoning, "推理"], ["f-out", p.output, "输出"]]) {
      if (v <= 0) continue;
      y -= v * unit;
      t += `<rect class="${cls}" x="${colX(c.n) - 11}" y="${y}" width="22" height="${v * unit}"><title>${name} ${v} tokens</title></rect>`;
    }
    if (c.usage.total_tokens) t += `<text x="${colX(c.n) + 16}" y="${y + 10}">${kfmt(c.usage.total_tokens)}</text>`;
  }
  const h2 = el("div", "trackhead");
  h2.append(el("span", "", "Token 脉冲"), legend([["var(--cache)", "缓存命中输入"], ["color-mix(in srgb, var(--accent) 55%, var(--panel))", "未缓存输入"], ["var(--think)", "推理"], ["var(--ok)", "输出"]]));
  // 3. 上下文压力：每次请求的输入 tokens 占窗口比例
  const W = r.inputCapacity || ui.ctxWindow, CH = 90, top = 12, bottom = CH - 14;
  const y = (v) => bottom - Math.min(1, v / W) * (bottom - top);
  let p = `<line class="grid" x1="${x0}" y1="${bottom}" x2="${x1}" y2="${bottom}"/>`;
  for (const [cls, f] of [["lim70", 0.7], ["lim90", 0.9]]) p += `<line class="${cls}" x1="${x0}" y1="${y(W * f)}" x2="${x1}" y2="${y(W * f)}"/><text class="muted" x="${x0}" y="${y(W * f) - 3}">${f * 100}%</text>`;
  const pts = r.calls.filter((c) => c.usage.prompt_tokens).map((c) => [colX(c.n), y(c.usage.prompt_tokens), c.usage.prompt_tokens, c]);
  if (pts.length) p += `<polyline class="curve" points="${pts.map((q) => q[0] + "," + q[1]).join(" ")}"/>`;
  pts.forEach(([x, py, v, c]) => {
    p += `<circle class="dot" cx="${x}" cy="${py}" r="3"><title>${v} / ${W}</title></circle><text x="${x + 6}" y="${py - 5}">${(v / W * 100).toFixed(1)}%</text>`;
    if (c.rebuilt) p += `<text class="warn" x="${x - 14}" y="${bottom - 3}">▼压缩</text>`;
  });
  const h3 = el("div", "trackhead");
  const win = el("input"); win.type = "number"; win.min = "1000"; win.step = "1000"; win.value = W; win.style.width = "96px";
  win.onchange = () => { ui.ctxWindow = Math.max(1000, Number(win.value) || 128000); save("ctxWindow", ui.ctxWindow); render(); };
  win.disabled = !!r.inputCapacity;
  const label = el("label", "legend", r.inputCapacity ? "输入容量 " : "窗口 ");
  label.append(win, r.inputCapacity ? " tokens，来自agent；曲线为API输入量，触发判断见终端used" : " tokens，按所用模型填写");
  h3.append(el("span", "", "上下文压力"), label);
  return [h1, svg(s, H), h2, svg(t, H), h3, svg(p, CH)];
}

// ---------- 视图三：多次运行对比，按轮次自动对齐 ----------

  const headRow = el("tr");
  headRow.append(el("th", "", "指标"), ...runs.map((r) => { const th = el("th", "", r.id); th.title = r.query; return th; }));

  const rows = [
    ["问题", (r) => clip(r.query, 40)],

      cell.append(el("div", "meta", `M${k} · ${c.ms ? sec(c.ms) : "…"} · ${kfmt(c.usage.total_tokens || 0)} tok`));

        chip.title = t.reason || toolSummary(t);

        cell.append(chip);

        const chip = el("span", "chip answer", "回答");
        chip.onclick = (ev) => { ev.stopPropagation(); select("ans", r); };

// ---------- 详情面板（inspector） ----------

}
function renderInspector(it) {

    add("用途", c.compact ? "上下文摘要（不执行工具）" : "任务决策");
    add("公共前缀", `${c.shared || 0} 条消息（实际缓存看usage）`);
    add("请求消息", (c.req.messages || []).length + " 条");
    add("耗时", c.ms ? `${c.ms} ms（非流式，无 TTFT 拆分）` : "等待响应");
    if (c.status) add("HTTP", String(c.status));

function requestInput(c, runID) {
  const { system, history, current } = requestParts(c);
  const saved = el("details");
  const key = `history:${runID}:${c.n}`;
  saved.open = ui.open.has(key);
  saved.ontoggle = () => saved.open ? ui.open.add(key) : ui.open.delete(key);
  saved.append(el("summary", "", `历史消息 · ${history.length} 条（已发送）`), ...history.map(message));
  const inputs = current.length ? current.map(message) : [el("div", "meta", "本次请求没有新增user或tool消息。")];
  return section(`本次模型输入 · ${system.length + history.length + current.length} 条 messages`,
    el("div", "label", `系统规则 · ${system.length} 条`), ...system.map(message),
    history.length ? saved : el("div", "meta", "历史消息 · 0 条（无历史对话）"),
    el("div", "label", `本轮输入 · ${current.length} 条`), ...inputs,
    el("div", "meta", "系统规则、历史与本轮输入均随请求发送；工具定义另放在 tools 字段。"));

// ---------- 数据加载、实时跟随与回放 ----------
function fetchEvents(id) {
  return new Promise((resolve) => {
    const list = [], es = new EventSource(`/runs/${id}/events`);
    es.onmessage = (m) => list.push(JSON.parse(m.data));
    es.addEventListener("end", () => { es.close(); resolve(list); });
    es.onerror = () => { es.close(); resolve(list); };
  });
}
function show(id) {
  stopReplay();
  if (ui.source) ui.source.close();
  if (ui.tab === "compare") ui.tab = "trace";
  Object.assign(ui, { run: newRun(id), events: [], follow: true, zoom: null, selected: null, expanded: false, loading: true, search: "", open: new Set() });
  $("search").value = "";
  ui.collapsed.clear();
  const es = ui.source = new EventSource(`/runs/${id}/events`);
  es.onmessage = (m) => { if (ui.source !== es) return; const e = JSON.parse(m.data); ui.events.push(e); apply(ui.run, e); schedule(); };
  es.addEventListener("end", () => {
    es.close();
    if (ui.source !== es) return;
    ui.loading = false;
    if (!ui.run.exit) { ui.run.exit = "进程中断，没有退出记录"; ui.run.tEnd = ui.run.last; } // 观测台在运行中重启过
    render(); loadRuns();
  });
  es.onerror = () => { es.close(); if (ui.source !== es) return; ui.loading = true; syncComposer(); $("hint").textContent = "连接中断，请重新选择对话加载记录。"; };
  render();
  loadRuns();
}
function stopReplay() {
  if (!ui.replay) return;
  clearTimeout(ui.replay.timer);
  ui.replay = null;
}
// 按真实时间间隔重放已结束的运行；折叠空闲时，单个间隔最多按 0.4 秒播放。
function startReplay() {
  if (!ui.run || !ui.run.exit || ui.tab === "compare") return;
  const events = ui.events.slice(), speed = Number($("speed").value), foldIdle = $("fold").checked;
  Object.assign(ui, { run: newRun(ui.run.id), follow: true, zoom: null, replay: { i: 0 } });
  const step = () => {
    if (!ui.replay) return;
    const e = events[ui.replay.i++];
    apply(ui.run, e);
    if (ui.replay.i >= events.length) ui.replay = null;
    render();
    if (!ui.replay) return;
    let gap = Date.parse(events[ui.replay.i].time) - Date.parse(e.time);
    if (foldIdle) gap = Math.min(gap, 400 * speed);
    ui.replay.timer = setTimeout(step, Math.max(0, gap / speed));
  };
  step();
}

// ---------- 对话流：从同一批模型请求还原用户消息、思考、工具和回答 ----------
// 只渲染少量 Markdown：先转义再替换，模型输出不能注入 HTML。
function md(text) {
  const lines = String(text || "").split("\n"), out = [];
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const block = /^(```|#{1,6}\s|\s*([-*]|\d+\.)\s|\|)/;
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if (/^#{1,6}\s/.test(line)) {
      out.push(`<h4>${inline(line.replace(/^#+\s*/, ""))}</h4>`); i++;
    } else if (/^\s*([-*]|\d+\.)\s/.test(line)) {
      const tag = /^\s*\d/.test(line) ? "ol" : "ul", items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i]); i++) items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s/, ""))}</li>`);
      out.push(`<${tag}>${items.join("")}</${tag}>`);
    } else if (line.startsWith("|")) {
      const rows = [];
      for (; i < lines.length && lines[i].startsWith("|"); i++) {
        if (/^\|[\s:|-]+\|?\s*$/.test(lines[i])) continue;
        const cells = lines[i].trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
        const tag = rows.length ? "td" : "th";
        rows.push("<tr>" + cells.map((c) => `<${tag}>${c}</${tag}>`).join("") + "</tr>");
      }
      out.push(`<table>${rows.join("")}</table>`);
    } else if (!line.trim()) i++;
    else {
      const para = [];
      for (; i < lines.length && lines[i].trim() && !block.test(lines[i]); i++) para.push(inline(lines[i]));
      out.push(`<p>${para.join("<br>")}</p>`);
    }
  }
  const box = el("div", "md");
  box.innerHTML = out.join("");
  return box;
}
const textOf = (m) => typeof m.content === "string" ? m.content : compact(m.content);
// 新的用户消息总在请求末尾；压缩后的请求里，摘要之前是保留的旧原话，只取摘要之后的部分。
function chatFlow(r) {
  const flow = [];
  let lastUser = null, replied = true;
  for (const c of r.calls) {
    if (c.compact) { flow.push({ kind: "compact", call: c }); continue; }
    const msgs = c.req.messages || [];
    let k = msgs.length;
    while (k > 0 && msgs[k - 1].role === "user") k--;
    const tail = msgs.slice(k), s = tail.findLastIndex((m) => textOf(m).startsWith(SUMMARY_PREFIX));
    for (const m of tail.slice(s + 1)) {
      const text = textOf(m);
      if (text === lastUser && !replied) continue; // 超窗重试会再发一次同一个问题
      flow.push({ kind: "user", text });
      lastUser = text; replied = false;
    }
    flow.push({ kind: "call", call: c });
    if (c.choice) replied = true;
  }
  return flow;
}
// 折叠状态按稳定 key 记住，实时刷新时不会被收起。
function step(key, head, body) {
  const box = el("details", "step");
  box.open = ui.open.has(key);
  box.ontoggle = () => box.open ? ui.open.add(key) : ui.open.delete(key);
  const sum = el("summary");
  sum.append(...head);
  const inner = el("div", "body");
  inner.append(...body);
  box.append(sum, inner);
  return box;
}
function observeAt(id) {
  Object.assign(ui, { page: "observe", tab: "trace", follow: false, selected: id, expanded: true });
  render(); loadRuns();
}
function renderCall(box, r, c, last) {
  const m = (c.choice && c.choice.message) || {};
  if (!c.end) return box.append(el("div", "shimmer", "思考中…"));
  if (!c.choice) {
    return box.append(step("e" + c.n, [el("span", "ico bad", "!"), el("span", "bad", `模型请求失败 · HTTP ${c.status}`)], [el("pre", "err", c.errorText || pretty(c.res))]));
  }
  if (m.reasoning_content) {
    const p = tokenParts(c.usage);
    box.append(step("r" + c.n, [el("span", "ico", "✻"), el("span", "", `思考了 ${sec(c.ms)}` + (p.reasoning ? ` · ${kfmt(p.reasoning)} tokens` : ""))], [el("div", "reason", m.reasoning_content)]));
  }
  if (m.content && c.tools.length) { const mid = md(m.content); mid.classList.add("mid"); box.append(mid); }
  for (const t of c.tools) {
    const icon = t.state === "running" ? el("span", "ico") : el("span", "ico " + (t.detour ? "bad" : "ok"), t.detour ? "✕" : "✓");
    if (t.state === "running") icon.append(el("span", "spin"));
    const head = [icon, el("span", "tname", t.name), el("span", "targs", clip(compact(t.args), 90))];
    if (t.done) head.push(el("span", "", sec(t.done - c.end)));
    const result = t.done ? el("pre", t.state === "error" ? "err" : "", pretty(t.result)) : el("div", "meta", t.state === "lost" ? "进程已结束，没有结果" : "执行中…");
    box.append(step(`t${c.n}-${t.index}`, head, [el("div", "label", "参数"), el("pre", "", pretty(t.args)), el("div", "label", "结果" + (t.reason ? " · " + t.reason : "")), result]));
  }
  if (!c.tools.length && m.content) {
    box.append(md(m.content));
    const meta = el("div", "answer-meta");
    meta.append(el("span", "", `模型调用 #${c.n} · ${kfmt(c.usage.total_tokens || 0)} tokens · ${sec(c.ms)}`));
    const link = el("button", "link", "在观测中查看");
    link.onclick = () => observeAt("m" + c.n);
    meta.append(link);
    box.append(meta);
  }
  if (last && !r.exit && c.tools.length && c.tools.every((t) => t.done)) box.append(el("div", "shimmer", "思考中…"));
}
function renderCompact(c) {
  const box = el("details", "divider"), key = "s" + c.n, m = (c.choice && c.choice.message) || {};
  box.open = ui.open.has(key);
  box.ontoggle = () => box.open ? ui.open.add(key) : ui.open.delete(key);
  const label = !c.end ? "正在压缩上下文…" : !c.choice || c.invalidSummary ? "上下文压缩失败" : `上下文已压缩 · 摘要 ${(m.content || "").length} 字 · ${sec(c.ms)}`;
  box.append(el("summary", "", label));
  const body = el("div", "body");
  body.append(c.choice && m.content ? md(m.content) : el("pre", "err", c.errorText || pretty(c.res || "")));
  if (c.end) box.append(body);
  return box;
}
function welcome() {
  const box = el("div", "welcome"), sugs = el("div", "sugs");
  box.append(el("h1", "", "想让 agent 做什么？"), sugs);
  for (const q of ["计算 (1234×5678) 开根号取整，并查询当前日期时间。两项独立，请同轮调用。", "先查学习笔记中的循环职责，再计算职责数量乘以25。"]) {
    const b = el("button", "", q);
    b.onclick = () => { $("query").value = q; syncComposer(); $("query").focus(); };
    sugs.append(b);
  }
  return box;
}
function renderChat() {
  const box = $("thread"), scroller = $("chat-scroll");
  const stick = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120, top = scroller.scrollTop;
  box.replaceChildren();
  const r = ui.run;
  if (!r) return box.append(welcome());
  analyze(r);
  if (r.query === LAB_TITLE) box.append(el("div", "banner", "Day 3 上下文实验：程序自动发出33轮真实对话，再触发一次大工具输出。下面的用户消息由实验程序发送。"));
  let group = null;
  const flow = chatFlow(r);
  flow.forEach((f, i) => {
    if (f.kind === "user") { const u = el("div", "u"); u.append(el("div", "", f.text)); box.append(u); group = null; return; }
    if (f.kind === "compact") return box.append(renderCompact(f.call));
    if (!group) box.append(group = el("div", "a"));
    renderCall(group, r, f.call, i === flow.length - 1);
  });
  if (r.pending) {
    const u = el("div", "u"); u.append(el("div", "", r.pending)); box.append(u);
    box.append(el("div", "shimmer", "正在启动 agent…"));
  } else if (!r.exit && !r.calls.length) box.append(el("div", "shimmer", "正在启动 agent…"));
  const last = r.calls.filter((c) => !c.compact).at(-1);
  const answered = last && last.choice && !last.tools.length && last.choice.message.content;
  if (r.exit && (r.exit !== "exit 0" || !answered)) {
    const card = el("div", "stopcard");
    card.append(el("div", "err", "agent 已停止：" + r.exit));
    const tail = r.logs.filter((l) => !l.text.startsWith("用户续聊：")).slice(-6);
    if (tail.length) card.append(el("pre", "", tail.map((l) => l.text).join("\n")));
    const link = el("button", "link", "查看终端输出");
    link.onclick = () => { observeAt("end"); };
    card.append(link);
    box.append(card);
  }
  scroller.scrollTop = stick ? scroller.scrollHeight : top;
}

// ---------- 外壳：顶栏、输入框与对话列表 ----------
function renderShell() {
  const r = ui.run, chat = ui.page === "chat";
  $("chat-pane").hidden = !chat;
  $("observe-pane").hidden = chat;
  $("page-chat").className = chat ? "on" : "";
  $("page-observe").className = chat ? "" : "on";
  $("cmp-hint").hidden = chat;
  $("title").textContent = ui.tab === "compare" && !chat ? `对比 ${ui.checked.size} 条运行` : r ? r.query || r.id : "新对话";
  const status = $("status");
  status.className = r && r.exit && r.exit !== "exit 0" ? "bad" : "";
  status.textContent = !r ? "" : ui.replay ? "回放中" : !r.exit ? `运行中 · 模型调用 ${r.calls.length} 次` : r.exit === "exit 0" ? `完成 · 模型调用 ${r.calls.length} 次` : "未正常结束";
}
function syncComposer() {
  const r = ui.run, busy = r && (ui.loading || !r.exit), broken = r && r.exit && r.exit !== "exit 0";
  $("send").disabled = ui.sending || !!busy || !!broken || !!ui.replay || !$("query").value.trim();
  $("query").placeholder = r ? "继续提问…" : "给 agent 布置一个任务…";
  $("mode-chip").textContent = r ? "续聊：" + clip(r.query, 60) : "新对话 · 默认10次模型请求预算";
  $("hint").textContent = !r ? "Enter 发送，Shift+Enter 换行；每个问题都会真实调用方舟模型" : ui.replay ? "回放中，结束后可继续提问" :
    busy ? "agent 正在回复，本轮结束后可以继续提问" : broken ? "上次运行未正常结束，请新建对话" : "Enter 发送，会延续这条对话的上下文";
}
function relTime(id) {
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id);
  return m ? `${m[2]}-${m[3]} ${m[4]}:${m[5]}` : id;
}
async function loadRuns() {
  const runs = await (await fetch("/runs")).json();
  const observe = ui.page === "observe";
  $("runs").replaceChildren(...runs.reverse().map((r) => {
    const row = el("div", "runitem" + (ui.run && r.id === ui.run.id && !(observe && ui.tab === "compare") ? " active" : ""));
    if (observe) {
      const box = el("input");
      box.type = "checkbox";
      box.checked = ui.checked.has(r.id);
      box.title = "加入对比";
      box.onchange = () => {
        if (box.checked && ui.checked.size >= 5) { box.checked = false; return; }
        box.checked ? ui.checked.add(r.id) : ui.checked.delete(r.id);
        if (ui.tab !== "compare") return render();
        if (ui.checked.size >= 2) openCompare(); else { ui.tab = "trace"; render(); }
      };
      row.append(box);
    }
    const b = el("button"), q = el("span", "q");
    if (!r.done) q.append(el("span", "live"));
    q.append(r.query === LAB_TITLE ? "⚗ Day 3 上下文实验" : r.query || "（无问题）");
    b.title = r.query;
    b.append(q, el("small", "", relTime(r.id)));
    b.onclick = () => { document.body.classList.remove("nav-open"); if (ui.tab === "compare") ui.tab = "trace"; show(r.id); };
    row.append(b);
    return row;
  }));
}
async function start(url, body) {
  ui.sending = true; syncComposer();
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) return alert(await res.text());
    $("query").value = "";
    ui.page = "chat";
    show((await res.json()).id);
  } catch (err) {
    alert("启动失败：" + err.message);
  } finally {
    ui.sending = false; syncComposer(); autosize();
  }
}
function autosize() { const q = $("query"); q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; }

$("page-chat").onclick = () => { ui.page = "chat"; if (ui.tab === "compare") ui.tab = "trace"; render(); loadRuns(); };
$("page-observe").onclick = () => { ui.page = "observe"; render(); loadRuns(); };
$("menu").onclick = () => document.body.classList.toggle("nav-open");
$("tab-trace").onclick = () => { ui.tab = "trace"; render(); loadRuns(); };
$("tab-maze").onclick = () => { ui.tab = "maze"; render(); loadRuns(); };
$("tab-compare").onclick = () => openCompare();
$("search").oninput = () => { ui.search = $("search").value; render(); };
$("expand").onclick = () => { ui.expanded = true; ui.collapsed.clear(); render(); };
$("replay").onclick = () => {
  if (!ui.replay) return startReplay();
  stopReplay();
  ui.run = newRun(ui.run.id);
  ui.events.forEach((e) => apply(ui.run, e));
  render();
};
$("terminal").onclick = () => select("end", ui.run);
$("new-chat").onclick = () => {
  stopReplay();
  if (ui.source) ui.source.close();
  Object.assign(ui, { page: "chat", tab: "trace", run: null, events: [], source: null, selected: null, loading: false });
  document.body.classList.remove("nav-open");
  $("stats").hidden = true;
  $("view").replaceChildren(el("div", "empty", "先在对话中提问，或从左侧选择历史对话"));
  $("inspector").replaceChildren(el("div", "empty", "点击事件或节点查看详情"));
  render(); loadRuns(); $("query").focus();
};
$("lab").onclick = () => {
  document.body.classList.remove("nav-open");
  if (!ui.sending && confirm("自动进行33轮真实对话和一次大工具输出实验，最多60次模型请求（minimal推理）。开始？")) start("/runs", { context_lab: true });
};
$("composer").onsubmit = (ev) => {
  ev.preventDefault();
  const query = $("query").value.trim();
  if ($("send").disabled || !query) return;
  start(ui.run ? `/runs/${ui.run.id}/messages` : "/runs", { query });
};
// 输入法组合输入时的 Enter 用于选词，不能发送。
$("query").onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("composer").requestSubmit(); } };
$("query").oninput = () => { autosize(); syncComposer(); };
render();
loadRuns();
</script>
